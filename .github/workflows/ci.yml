name: CI

# release.yml only runs on tags, so this is what actually verifies day-to-day
# work. Same checks, minus packaging and publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck extension host
        run: npm run compile

      - name: Typecheck webview
        run: npm run typecheck:webview

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
