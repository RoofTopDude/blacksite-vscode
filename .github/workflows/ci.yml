name: CI

# release.yml only runs on tags, so this is what actually verifies day-to-day
# work. Same checks, minus packaging and publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck extension host
        run: npm run compile

      - name: Typecheck webview
        run: npm run typecheck:webview

      - name: Unit tests and coverage thresholds
        run: npm run test:coverage

      - name: Security policy and public advisories
        run: npm run security

      - name: Build
        run: npm run build

      # @blacksite-agent/llm as it would be published: its built output must match the reviewed API
      # reports (packages/llm/etc), and the CLI, which loads that built output like any other
      # consumer, must pass its offline probe.
      - name: Model transport package
        run: |
          npm run check:api
          npm run build -w @blacksite-agent/llm-cli
          node packages/llm-cli/dist/cli.js probe --fixture

      - name: Browser policy integration
        run: |
          npx --no-install playwright-core install --with-deps chromium
          npm run test:browser
