name: Pages

# Builds and deploys the marketing/docs site in site/, and regenerates
# site/latest.json — from the release being published when there is one in
# context, and from the newest published release otherwise.
#
# latest.json exists so the in-extension updater has an option that is not the
# GitHub API: api.github.com allows 60 unauthenticated requests per hour per IP,
# which several developers behind one corporate NAT will exhaust, and the
# updater checks on startup. A static file on Pages has no such limit and needs
# no token.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - scripts/build-site.mjs
      - scripts/build-icons.mjs
      - scripts/site-chrome.mjs
      - .github/workflows/pages.yml
  # Fires when a human publishes a release through the GitHub UI. It does NOT
  # fire for releases created by release.yml: GitHub suppresses workflow
  # triggers from events generated with the default GITHUB_TOKEN, as loop
  # prevention. That path is covered by workflow_call below instead.
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a site deploy interrupt one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # markdown-it and highlight.js are already runtime dependencies of the
      # extension, and the icon sprite is generated from lucide-react, which is
      # one too — so building the site needs no extra packages.
      - name: Install dependencies
        run: npm ci

      # Renders site/pages/*.html and docs/**/*.md into site/, through the one
      # shared page shell in scripts/site-chrome.mjs.
      - name: Build the site
        run: npm run build:site

      # Derived from a real release rather than from package.json on main, so the
      # site never advertises a version nobody can download yet.
      #
      # RELEASE_TAG names the release being published, when this run knows of
      # one: the `release` event carries it directly, and a workflow_call from
      # release.yml runs on the caller's ref, which is the v* tag. A push to
      # main or a manual dispatch has no release in context and leaves it empty.
      #
      # That distinction is the whole point of this step's shape. Asking for the
      # release *by tag* is exact; asking `gh release view` with no argument
      # reads GitHub's computed "Latest release" pointer, which lags the publish
      # step in the very same run by a few seconds. When refresh-site started 9s
      # after publishing v1.5.2 it read v1.5.1 and shipped a manifest telling
      # every installed extension the old version was current; the v1.5.1
      # release, whose gap happened to be 16s, was fine. That is a coin flip on
      # runner scheduling latency, and it decides what the in-extension updater
      # offers to everyone until the next deploy.
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail

          fields="tagName,name,publishedAt,url,assets"
          resolved=""

          if [ -n "${RELEASE_TAG}" ]; then
            echo "Reading the release in context: ${RELEASE_TAG}"
            if gh release view "${RELEASE_TAG}" --json "$fields" > release.json 2>/dev/null; then
              resolved="${RELEASE_TAG}"
            else
              # Falling back to the pointer here is the old, occasionally-stale
              # behaviour rather than a correct one — but it beats blanking a
              # manifest that was previously right.
              echo "::warning::No release found for ${RELEASE_TAG}; falling back to the latest published release."
            fi
          fi

          if [ -z "$resolved" ] && ! gh release view --json "$fields" > release.json 2>/dev/null; then
            echo "No published release yet; writing an empty manifest."
            echo '{"version":null,"note":"No release published yet."}' > site/latest.json
            exit 0
          fi

          node - <<'NODE'
          const fs = require("node:fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const vsix = (release.assets ?? []).find((a) => a.name.endsWith(".vsix"));

          if (!vsix) {
            throw new Error(`Release ${release.tagName} has no .vsix asset.`);
          }

          const version = (vsix.name.match(/(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\.vsix$/i) ?? [])[1]
            ?? release.tagName.replace(/^v/, "");

          fs.writeFileSync("site/latest.json", JSON.stringify({
            version,
            tag: release.tagName,
            name: release.name,
            publishedAt: release.publishedAt,
            releaseUrl: release.url,
            downloadUrl: vsix.url,
            fileName: vsix.name,
            size: vsix.size ?? null,
            minimumVscodeVersion: require("./package.json").engines.vscode,
          }, null, 2) + "\n");

          console.log(`latest.json -> ${version}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
