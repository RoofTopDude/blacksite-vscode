name: Release

# Tag-triggered, unlike the monorepo workflow this replaces, which fired on
# every push to every branch. In a public repo that produced a prerelease per
# commit; here a release is a deliberate act:
#
#   npm version <patch|minor|major> && git push --follow-tags
#
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json produces a release whose asset
      # filename contradicts its own tag, and the in-extension updater compares
      # the two. Fail loudly here instead.
      - name: Verify tag matches package version
        id: version
        run: |
          manifest="$(node -p "require('./package.json').version")"
          echo "value=${manifest}" >> "$GITHUB_OUTPUT"

          # A semver prerelease identifier (1.24.0-pre.1) selects the prerelease
          # channel. That distinction decides two things below, and getting either
          # wrong ships an untested build to everyone: the release is marked
          # --prerelease rather than --latest, and refresh-site is skipped so
          # site/latest.json keeps pointing at the newest STABLE release. Users on
          # the default channel read only that manifest; users who set
          # blacksite.updates.includePrerelease skip it and query the GitHub API,
          # which is the only source that can see a prerelease at all.
          if [[ "${manifest}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${manifest} to the PRERELEASE channel; latest.json will not move."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "${tagged}" != "${manifest}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${manifest}."
              exit 1
            fi
          fi

      - name: Verify
        run: |
          npm run lint
          npm run test:coverage
          npm run compile
          npm run typecheck:webview
          npm run security
          npm run build

      - name: Browser policy integration
        run: |
          npx --no-install playwright-core install --with-deps chromium
          npm run test:browser

      - name: Package VSIX
        run: |
          npx --no-install vsce package
          node scripts/verify-vsix.mjs

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blacksite-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "${PRERELEASE}" = "true" ]; then
            channel_note="This is a **prerelease**. It reaches only users who have set \`blacksite.updates.includePrerelease\`; the default update channel stays on the newest stable release."
            # --prerelease, never --latest: marking a prerelease "latest" moves
            # GitHub's own pointer, which is what the stable fallback path reads.
            channel_flag="--prerelease"
          else
            channel_note="See CHANGELOG.md for what changed."
            channel_flag="--latest"
          fi

          notes="$(cat <<EOF
          Blacksite VS Code extension v${VERSION}.

          ${channel_note}

          Install with:

              code --install-extension blacksite-vscode-${VERSION}.vsix

          Or in VS Code: Extensions -> ... -> Install from VSIX.
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Blacksite v${VERSION}" --notes "$notes" $channel_flag
            gh release upload "$TAG" ./*.vsix --clobber
          else
            gh release create "$TAG" ./*.vsix \
              --title "Blacksite v${VERSION}" \
              --notes "$notes" \
              $channel_flag
          fi

  # Called explicitly rather than relying on pages.yml's `release: [published]`
  # trigger, which cannot fire here: the release above is created with the
  # default GITHUB_TOKEN, and GitHub does not start workflows from events that
  # token generates. Without this job, site/latest.json would go stale after
  # every automated release — which is not cosmetic, since the in-extension
  # updater reads that manifest first and would keep advertising the previous
  # version to everyone.
  #
  # This job runs on the TAG ref, so the github-pages environment must permit
  # tags to deploy. Its deployment branch policy allows `main` and `v*`; if a
  # release ever fails here with "not allowed to deploy to github-pages due to
  # environment protection rules", that `v*` tag policy is missing. Re-add it:
  #   gh api --method POST \
  #     repos/OWNER/REPO/environments/github-pages/deployment-branch-policies \
  #     -f name='v*' -f type='tag'
  # then re-run this job, or run pages.yml manually on main to unstick the
  # manifest (`gh workflow run pages.yml --ref main`).
  #
  # Skipped for prereleases. pages.yml derives latest.json from the release in
  # context — the tag this run is on — so letting it run here would write the
  # prerelease into the manifest that every default-channel user reads, which is
  # precisely the audience a prerelease is meant to exclude. Stable users keep
  # being offered the last stable release until the next stable tag.
  refresh-site:
    name: Refresh site and latest.json
    needs: release
    if: github.ref_type == 'tag' && needs.release.outputs.prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
