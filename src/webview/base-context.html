<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Blacksite Base Context</title>
<style>
:root{
  --bg: var(--vscode-sideBar-background, #111111);
  --fg: var(--vscode-foreground, #f3f3f3);
  --muted: var(--vscode-descriptionForeground, #909090);
  --border: rgba(255,255,255,0.09);
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.07);
  --accent: #d97706;
  --accent-soft: rgba(217,119,6,0.18);
  --ok: #6ee7b7;
  --danger: #fb7185;
  --radius: 10px;
  --font: var(--vscode-font-family, system-ui, sans-serif);
  --mono: var(--vscode-editor-font-family, monospace);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at top right, rgba(217,119,6,0.12), transparent 35%),
    var(--bg);
  color:var(--fg);
  font:13px/1.5 var(--font);
}
.shell{display:flex;flex-direction:column;min-height:100vh}
.header{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title{font-size:14px;font-weight:700}
.sub{color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--fg);
  border-radius:9px;
  padding:7px 10px;
  cursor:pointer;
  font:12px var(--font);
}
button:hover{background:var(--surface-2)}
button.primary{
  background:var(--accent-soft);
  border-color:rgba(217,119,6,0.4);
}
.status{
  color:var(--muted);
  font-size:11px;
  font-family:var(--mono);
}
.list{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:12px;
}
.empty{
  margin:12px;
  padding:18px;
  border:1px dashed var(--border);
  border-radius:var(--radius);
  color:var(--muted);
  background:rgba(255,255,255,0.02);
}
.topic{
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  overflow:hidden;
}
.topic-head{
  display:flex;
  gap:10px;
  align-items:flex-start;
  justify-content:space-between;
  padding:12px 12px 8px;
}
.topic-main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.topic-title{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--fg);
  font:600 13px var(--font);
  padding:4px 6px;
  border-radius:8px;
}
.topic-title:focus,
.notes:focus{
  outline:none;
  border-color:rgba(217,119,6,0.55);
  background:rgba(255,255,255,0.04);
}
.topic-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:var(--muted);
  font-size:10.5px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:2px 8px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
}
.topic-head-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-end;
}
.toggle{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
}
.toggle input{accent-color:var(--accent)}
.topic-body{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:0 12px 12px;
}
.notes{
  width:100%;
  min-height:108px;
  resize:vertical;
  background:rgba(255,255,255,0.03);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 11px;
  font:12px/1.45 var(--font);
}
.files{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.file-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,0.025);
}
.file-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.file-path{
  font:11px var(--mono);
  color:var(--fg);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.file-label{
  color:var(--muted);
  font-size:10.5px;
}
.file-actions{display:flex;gap:6px}
.topic-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.mini{
  font-size:10.5px;
  color:var(--muted);
}
.danger{
  border-color:rgba(251,113,133,0.35);
  color:var(--danger);
}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="title-row">
      <div>
        <div class="title">Base Context</div>
        <div class="sub">Static, cross-conversation project context. Topics and linked files are loaded into the agent prompt every run.</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="newTopicBtn">New Topic</button>
      <button id="addFileBtn">Add Active File</button>
      <button id="refreshBtn">Refresh</button>
    </div>
    <div class="status" id="statusLine">No active editor file.</div>
  </div>
  <div id="topicList" class="list"></div>
</div>

<script>
const vscode = acquireVsCodeApi();
let docState = { topics: [] };
let activeFile = null;
const saveTimers = new Map();

function esc(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function setStatus() {
  const statusLine = document.getElementById("statusLine");
  statusLine.textContent = activeFile
    ? `Active editor file: ${activeFile}`
    : "No active editor file.";
}

function queueTopicUpdate(topicId, patch) {
  const key = `${topicId}:${Object.keys(patch).join(",")}`;
  const existing = saveTimers.get(key);
  if (existing) clearTimeout(existing);
  const next = setTimeout(() => {
    vscode.postMessage({ type: "update_topic", topicId, ...patch });
    saveTimers.delete(key);
  }, 220);
  saveTimers.set(key, next);
}

function render() {
  setStatus();
  const root = document.getElementById("topicList");
  root.replaceChildren();

  if (!Array.isArray(docState.topics) || docState.topics.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No Base Context topics yet. Create one, add notes, and attach workspace files you want loaded across conversations.";
    root.appendChild(empty);
    return;
  }

  for (const topic of docState.topics) {
    const card = document.createElement("section");
    card.className = "topic";

    const head = document.createElement("div");
    head.className = "topic-head";

    const main = document.createElement("div");
    main.className = "topic-main";

    const title = document.createElement("input");
    title.className = "topic-title";
    title.value = topic.title || "";
    title.placeholder = "Topic title";
    title.addEventListener("input", () => queueTopicUpdate(topic.id, { title: title.value }));

    const meta = document.createElement("div");
    meta.className = "topic-meta";
    meta.innerHTML = `
      <span class="pill">${topic.enabled ? "Included in prompt" : "Hidden from prompt"}</span>
      <span class="pill">${Array.isArray(topic.files) ? topic.files.length : 0} file(s)</span>
      <span class="pill">${topic.pinned ? "Pinned" : "Standard"}</span>
    `;

    main.append(title, meta);

    const headActions = document.createElement("div");
    headActions.className = "topic-head-actions";

    const includeToggle = document.createElement("label");
    includeToggle.className = "toggle";
    includeToggle.innerHTML = `<input type="checkbox" ${topic.enabled ? "checked" : ""}> Include`;
    includeToggle.querySelector("input").addEventListener("change", (event) => {
      vscode.postMessage({
        type: "update_topic",
        topicId: topic.id,
        enabled: event.target.checked
      });
    });

    const pinToggle = document.createElement("label");
    pinToggle.className = "toggle";
    pinToggle.innerHTML = `<input type="checkbox" ${topic.pinned ? "checked" : ""}> Pin`;
    pinToggle.querySelector("input").addEventListener("change", (event) => {
      vscode.postMessage({
        type: "update_topic",
        topicId: topic.id,
        pinned: event.target.checked
      });
    });

    headActions.append(includeToggle, pinToggle);
    head.append(main, headActions);

    const body = document.createElement("div");
    body.className = "topic-body";

    const notes = document.createElement("textarea");
    notes.className = "notes";
    notes.placeholder = "Persistent context, assumptions, architecture notes, prompts, API references, or anything the agent should always know for this topic.";
    notes.value = topic.notes || "";
    notes.addEventListener("input", () => queueTopicUpdate(topic.id, { notes: notes.value }));

    const filesWrap = document.createElement("div");
    filesWrap.className = "files";
    if (Array.isArray(topic.files) && topic.files.length > 0) {
      for (const file of topic.files) {
        const row = document.createElement("div");
        row.className = "file-row";
        row.innerHTML = `
          <div class="file-copy">
            <div class="file-path">${esc(file.path)}</div>
            <div class="file-label">Loaded as static context</div>
          </div>
          <div class="file-actions">
            <button data-open="${esc(file.path)}">Open</button>
            <button class="danger" data-remove="${esc(file.id)}">Remove</button>
          </div>
        `;
        row.querySelector("[data-open]").addEventListener("click", () => {
          vscode.postMessage({ type: "open_file", path: file.path });
        });
        row.querySelector("[data-remove]").addEventListener("click", () => {
          vscode.postMessage({ type: "remove_file", topicId: topic.id, fileId: file.id });
        });
        filesWrap.appendChild(row);
      }
    } else {
      const emptyFiles = document.createElement("div");
      emptyFiles.className = "mini";
      emptyFiles.textContent = "No linked files yet.";
      filesWrap.appendChild(emptyFiles);
    }

    const foot = document.createElement("div");
    foot.className = "topic-foot";

    const info = document.createElement("div");
    info.className = "mini";
    info.textContent = `Updated ${topic.updatedAt || topic.createdAt || "recently"}`;

    const footActions = document.createElement("div");
    footActions.className = "file-actions";

    const addFile = document.createElement("button");
    addFile.textContent = "Add Active File";
    addFile.addEventListener("click", () => vscode.postMessage({ type: "add_file_to_topic", topicId: topic.id }));

    const removeTopic = document.createElement("button");
    removeTopic.className = "danger";
    removeTopic.textContent = "Delete Topic";
    removeTopic.addEventListener("click", () => vscode.postMessage({ type: "delete_topic", topicId: topic.id }));

    footActions.append(addFile, removeTopic);
    foot.append(info, footActions);

    body.append(notes, filesWrap, foot);
    card.append(head, body);
    root.appendChild(card);
  }
}

document.getElementById("newTopicBtn").addEventListener("click", () => {
  vscode.postMessage({ type: "create_topic" });
});
document.getElementById("addFileBtn").addEventListener("click", () => {
  vscode.postMessage({ type: "add_active_file" });
});
document.getElementById("refreshBtn").addEventListener("click", () => {
  vscode.postMessage({ type: "refresh" });
});

window.addEventListener("message", (event) => {
  const msg = event.data;
  if (msg.type === "base_context_state") {
    docState = msg.document || { topics: [] };
    activeFile = typeof msg.activeFile === "string" ? msg.activeFile : null;
    render();
  }
});

vscode.postMessage({ type: "ready" });
</script>
</body>
</html>
